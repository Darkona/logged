import org.springframework.boot.gradle.plugin.SpringBootPlugin

import java.util.regex.Pattern

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.vanniktech.maven.publish' version '0.34.0'
}

group = 'io.github.darkona'
// The release workflow passes the git-tag version via ORG_GRADLE_PROJECT_version;
// assigning unconditionally here would override it, so only fall back when absent.
version = providers.gradleProperty('version').getOrElse('1.6.1')

def logbackVersion = "1.5.38"
def filename = "${rootProject.name}-${this.version}.jar"
def isCi = providers.environmentVariable("CI").isPresent()
def isRelease = providers.gradleProperty("release").map { it.toBoolean() }.orElse(false).get()

repositories {
    mavenCentral()
    if (!isCi) {
        mavenLocal()
    }
}

// DO NOT TOUCH THIS
def orderedProcessors = [
        'lombok.launch.AnnotationProcessorHider$AnnotationProcessor',
        'org.springframework.boot.configurationprocessor.ConfigurationMetadataAnnotationProcessor'
].join(',')


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs = options.compilerArgs.findAll { it != '-parameters' && !it.startsWith('-processor') }
    options.compilerArgs += ['-parameters', '-processor', orderedProcessors]
}

java {

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    artifacts {
        archives jar
    }

}

jar {
    enabled = true
    archiveFileName = filename
    manifest {
        attributes(
                "Implementation-Title": rootProject.name,
                "Implementation-Version": version,
                "Implementation-Vendor": "Javier Darkona",
                "Automatic-Module-Name": "io.github.darkona.logged"
        )
    }
}

compileJava.dependsOn(processResources)

mavenPublishing {

    publishToMavenCentral()

    if (isRelease) {
        signAllPublications()
    }

    coordinates(group.toString(), rootProject.name, version.toString())

    pom {
        name = "Logged"
        description = "Spring-Boot Aspect-Based Logging helper that allows annotating methods so they are logged on entry, on return and on exception."
        inceptionYear = "2025"
        url = "https://github.com/Darkona/logged"
        licenses {
            license {
                name = "LGPL-3.0-or-later"
                url = "https://www.gnu.org/licenses/lgpl-3.0.txt"
                distribution = "repo"
            }
        }
        developers {
            developer {
                id = "Darkona"
                name = "Javier Darkona"
                url = "https://github.com/Darkona"
            }
        }
        scm {
            url = "https://github.com/Darkona/logged"
            connection = "scm:git:git://github.com/Darkona/logged.git"
            developerConnection = "scm:git:ssh://git@github.com/Darkona/logged.git"
        }
    }

}

publishing {
    publications.withType(MavenPublication).configureEach {
        versionMapping {
            usage('java-api') { fromResolutionResult() }
            usage('java-runtime') { fromResolutionResult() }
        }
    }
}

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
        mavenBom("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.30.0")
    }
}

configurations.named("testImplementation") {
    exclude group: 'org.mockito'
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}
tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
sourceSets {

    testLog4j2 {

        java.srcDir 'src/testLog4j2/java'
        resources.srcDir 'src/testLog4j2/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    testLogback {
        java.srcDir 'src/testLogback/java'
        resources.srcDir 'src/testLogback/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    test {
        java.srcDir 'src/test/java'
        resources.srcDir 'src/test/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    // --- Log4j2 test suite ---
    testLog4j2Implementation.extendsFrom testImplementation
    testLog4j2RuntimeOnly.extendsFrom testRuntimeOnly
    testLog4j2CompileOnly.extendsFrom testCompileOnly
    testLog4j2AnnotationProcessor.extendsFrom testAnnotationProcessor

    // --- Logback test suite ---
    testLogbackImplementation.extendsFrom testImplementation
    testLogbackRuntimeOnly.extendsFrom testRuntimeOnly
    testLogbackCompileOnly.extendsFrom testCompileOnly
    testLogbackAnnotationProcessor.extendsFrom testAnnotationProcessor

    configureEach {
        resolutionStrategy {
            cacheChangingModulesFor 60, 'seconds'
        }
    }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-aop"

    compileOnly "org.springframework.boot:spring-boot-autoconfigure"

    compileOnly 'org.projectlombok:lombok'
    compileOnly "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter"
    compileOnly 'org.springframework.boot:spring-boot-starter-log4j2'
    compileOnly "ch.qos.logback:logback-classic:${logbackVersion}"
    compileOnly "ch.qos.logback:logback-core:${logbackVersion}"

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"


    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'

    testAnnotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

}
dependencies {

    testLog4j2Implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    testLog4j2Implementation 'org.apache.logging.log4j:log4j-core'
    /* -------------------   LOG4J2 ---------------------------*/
    configurations.testLog4j2Implementation {
        exclude group: "ch.qos.logback", module: "logback-classic"
        exclude group: "ch.qos.logback", module: "logback-core"
    }

    testLogbackImplementation "ch.qos.logback:logback-classic:${logbackVersion}"
    testLogbackImplementation "ch.qos.logback:logback-core:${logbackVersion}"

    configurations.testLogbackImplementation {
        exclude group: "org.apache.logging.log4j"
    }
}

//tasks.withType(JavaCompile).configureEach {
//    options.generatedSourceOutputDirectory.set(
//            layout.buildDirectory.dir("generated/sources/annotationProcessor/${name}")
//    )
//}

tasks.register('testLog4j2', Test) {
    description = 'Runs tests with Log4j2 stack'
    testClassesDirs = sourceSets.testLog4j2.output.classesDirs
    classpath = sourceSets.testLog4j2.runtimeClasspath
    useJUnitPlatform()

    systemProperty "log4j2.isThreadContextMapInheritable", "true"
    systemProperty "spring.profiles.active", "log4j2"
}


tasks.register('testLogback', Test) {
    description = 'Runs tests with Logback stack'
    testClassesDirs = sourceSets.testLogback.output.classesDirs
    classpath = sourceSets.testLogback.runtimeClasspath
    useJUnitPlatform()
    systemProperty "spring.profiles.active", "logback"
}

// Ensure default test task (src/test) uses JUnit Platform
tasks.named('test', Test) {
    useJUnitPlatform()
}


tasks.register('checkReadmeVersion') {
    group = 'verification'
    description = 'Verify README.md uses the current project.version'
    doLast {
        def v = Pattern.quote(project.version.toString())
        def readme = file('README.md').getText('UTF-8')
        def mvnOk = (readme =~ /(?s)<artifactId>logged<\/artifactId>.*?<version>${v}<\/version>/).find()
        def gradleOk = (readme =~ /io\.github\.darkona:logged:${v}/).find()
        if (!mvnOk || !gradleOk) {
            throw new GradleException("README.md version mismatch. Run :updateReadmeVersion")
        }
    }
}

tasks.register('updateReadmeVersion') {
    group = 'documentation'
    description = 'Rewrite README.md dependency snippets to the current project.version'
    def readmeFile = file('README.md')
    def newVersion = project.version.toString()
    doLast {
        def text = readmeFile.getText('UTF-8')
        text = text.replaceAll(
                /(?s)(<artifactId>logged<\/artifactId>\s*<version>)[^<]+(<\/version>)/,
                '$1' + newVersion + '$2')
        text = text.replaceAll(
                /io\.github\.darkona:logged:[\w.\-]+/,
                "io.github.darkona:logged:${newVersion}")
        readmeFile.setText(text, 'UTF-8')
    }
}

// Guard on CI/local checks
tasks.named('check').configure {
    dependsOn 'test'
    dependsOn 'testLog4j2'
    dependsOn 'testLogback'
    dependsOn 'checkReadmeVersion'
}

