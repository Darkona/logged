import org.springframework.boot.gradle.plugin.SpringBootPlugin

import java.util.regex.Pattern

// --- Build classpath security floors --------------------------------------
// The publishing plugin drags vulnerable transitives into the build classpath.
// They never reach the published artifact, but Dependabot reports them and the
// build machine still runs them, so they are pinned here.
//
// Constraints on the buildscript classpath, not the ones further down: that
// block covers what the library compiles and ships against.
buildscript {
    dependencies {
        constraints {
            classpath('org.apache.httpcomponents.core5:httpcore5:5.4.3') {
                because 'GHSA-hf6x-8p5f-cgmf, high. com.vanniktech.maven.publish 0.34.0 resolves 5.3.6.'
            }
            classpath('org.apache.httpcomponents.core5:httpcore5-h2:5.4.3') {
                because 'GHSA-v3jc-474w-2wm6, high. com.vanniktech.maven.publish 0.34.0 resolves 5.3.6.'
            }
            classpath('org.apache.httpcomponents.client5:httpclient5:5.6.4') {
                because 'GHSA-hjcp-jmpx-g3qm. com.vanniktech.maven.publish 0.34.0 resolves 5.5.2.'
            }
            classpath('com.fasterxml.jackson.core:jackson-databind:2.21.6') {
                because 'GHSA-5gvw-p9qm-jgwh, GHSA-5jmj-h7xm-6q6v, GHSA-mhm7-754m-9p8w. Resolves 2.21.4 here.'
            }
            classpath('org.apache.commons:commons-lang3:3.18.0') {
                because 'GHSA-j288-q9x7-2f5v: uncontrolled recursion in ClassUtils. Resolves 3.16.0 here.'
            }
        }
    }
}


plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.vanniktech.maven.publish' version '0.34.0'
    // Compiles the aspects with ajc so WeavedAspect gets the aspectOf() factory that
    // compile-time weaving in a consumer build needs. javac alone does not emit it, and
    // load-time weaving hides the gap because the agent generates it on class load.
    id 'io.freefair.aspectj.post-compile-weaving' version '9.5.0'
}

group = 'io.github.darkona'
// The release workflow passes the git-tag version via ORG_GRADLE_PROJECT_version;
// assigning unconditionally here would override it, so only fall back when absent.
version = providers.gradleProperty('version').getOrElse('1.7.0')

def logbackVersion = "1.5.38"
def filename = "${rootProject.name}-${this.version}.jar"
def isCi = providers.environmentVariable("CI").isPresent()
def isRelease = providers.gradleProperty("release").map { it.toBoolean() }.orElse(false).get()

repositories {
    mavenCentral()
    if (!isCi) {
        mavenLocal()
    }
}

// DO NOT TOUCH THIS
def orderedProcessors = [
        'lombok.launch.AnnotationProcessorHider$AnnotationProcessor',
        'org.springframework.boot.configurationprocessor.ConfigurationMetadataAnnotationProcessor'
].join(',')


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs = options.compilerArgs.findAll { it != '-parameters' && !it.startsWith('-processor') }
    options.compilerArgs += ['-parameters', '-processor', orderedProcessors]
}

java {

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    artifacts {
        archives jar
    }

}

jar {
    enabled = true
    archiveFileName = filename
    manifest {
        attributes(
                "Implementation-Title": rootProject.name,
                "Implementation-Version": version,
                "Implementation-Vendor": "Javier Darkona",
                "Automatic-Module-Name": "io.github.darkona.logged"
        )
    }
}

compileJava.dependsOn(processResources)

// ajc lint configuration. Declared as a task input because neither the compiler args nor
// the file they point at are inputs by default: editing the file would otherwise leave
// compileJava UP-TO-DATE and the previous weaving in place.
def ajcLintFile = layout.projectDirectory.file('gradle/aspectj-lint.properties')
tasks.withType(JavaCompile).configureEach {
    // io.freefair.aspectj.post-compile-weaving hangs its AjcAction off the compile task.
    def ajc = extensions.findByName('ajc')
    if (ajc != null) {
        ajc.options.compilerArgs.addAll('-Xlintfile', ajcLintFile.asFile.absolutePath)
        inputs.file(ajcLintFile).withPropertyName('ajcLintFile').withPathSensitivity(PathSensitivity.RELATIVE)
    }
}

mavenPublishing {

    publishToMavenCentral()

    if (isRelease) {
        signAllPublications()
    }

    coordinates(group.toString(), rootProject.name, version.toString())

    pom {
        name = "Logged"
        description = "Spring-Boot Aspect-Based Logging helper that allows annotating methods so they are logged on entry, on return and on exception."
        inceptionYear = "2025"
        url = "https://github.com/Darkona/logged"
        licenses {
            license {
                name = "Apache-2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "repo"
            }
        }
        developers {
            developer {
                id = "Darkona"
                name = "Javier Darkona"
                url = "https://github.com/Darkona"
            }
        }
        scm {
            url = "https://github.com/Darkona/logged"
            connection = "scm:git:git://github.com/Darkona/logged.git"
            developerConnection = "scm:git:ssh://git@github.com/Darkona/logged.git"
        }
    }

}

publishing {
    publications.withType(MavenPublication).configureEach {
        versionMapping {
            usage('java-api') { fromResolutionResult() }
            usage('java-runtime') { fromResolutionResult() }
        }
    }
}

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
        mavenBom("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.30.0")
    }
}

configurations.named("testImplementation") {
    exclude group: 'org.mockito'
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}
tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
sourceSets {

    testLog4j2 {

        java.srcDir 'src/testLog4j2/java'
        resources.srcDir 'src/testLog4j2/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    testLogback {
        java.srcDir 'src/testLogback/java'
        resources.srcDir 'src/testLogback/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    testWeaving {
        java.srcDir 'src/testWeaving/java'
        resources.srcDir 'src/testWeaving/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    test {
        java.srcDir 'src/test/java'
        resources.srcDir 'src/test/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    // --- Log4j2 test suite ---
    testLog4j2Implementation.extendsFrom testImplementation
    testLog4j2RuntimeOnly.extendsFrom testRuntimeOnly
    testLog4j2CompileOnly.extendsFrom testCompileOnly
    testLog4j2AnnotationProcessor.extendsFrom testAnnotationProcessor

    // --- Logback test suite ---
    testLogbackImplementation.extendsFrom testImplementation
    testLogbackRuntimeOnly.extendsFrom testRuntimeOnly
    testLogbackCompileOnly.extendsFrom testCompileOnly
    testLogbackAnnotationProcessor.extendsFrom testAnnotationProcessor

    // --- Compile-time weaving suite ---
    testWeavingImplementation.extendsFrom testImplementation
    testWeavingRuntimeOnly.extendsFrom testRuntimeOnly
    testWeavingCompileOnly.extendsFrom testCompileOnly
    testWeavingAnnotationProcessor.extendsFrom testAnnotationProcessor

    configureEach {
        resolutionStrategy {
            cacheChangingModulesFor 60, 'seconds'
        }
    }
}

// --- Security floors ------------------------------------------------------
// Patched versions for transitive dependencies flagged by Dependabot. Each
// entry names the advisory it closes, so the block can be pruned once the
// upstream BOM already resolves at or above the floor.
//
// Two mechanisms, because they do not overlap:
//
//  * BOM property overrides. io.spring.dependency-management pins managed
//    versions hard, and a Gradle constraint loses against that pin. These
//    properties are the supported way to move a Spring Boot managed version.
//  * Gradle constraints, for coordinates no BOM manages, and to carry the
//    floors to consumers through the published metadata.

// GHSA-3pxv-7cmr-fjr4, GHSA-445c-vh5m-36rj, GHSA-6hg6-v5c8-fphq and
// GHSA-vc5p-v9hr-52mj (log4j-core), GHSA-qv9r-c865-cp47 (log4j-api).
// Spring Boot 3.5.16 manages 2.24.3.
ext['log4j2.version'] = '2.25.5'

// GHSA-5gvw-p9qm-jgwh, GHSA-5jmj-h7xm-6q6v, GHSA-mhm7-754m-9p8w.
// Spring Boot 3.5.16 manages 2.21.4.
ext['jackson-bom.version'] = '2.21.6'

// Aligns the transitive logback from spring-boot-starter-logging (1.5.34)
// with the version this library compiles against.
ext['logback.version'] = logbackVersion

dependencies {
    constraints {
        def floors = [
                'net.minidev:json-smart:2.5.2'                      :
                        'GHSA-pq2g-wx69-c263 (CVE-2024-57699), high: uncontrolled recursion. json-path 2.9.0 resolves 2.5.0, and no BOM manages it.',
                'org.apache.logging.log4j:log4j-core:2.25.5'        :
                        'Carries the log4j2.version floor to consumers that do not apply the Spring Boot BOM.',
                'org.apache.logging.log4j:log4j-api:2.25.5'         :
                        'Carries the log4j2.version floor to consumers that do not apply the Spring Boot BOM.',
                'com.fasterxml.jackson.core:jackson-databind:2.21.6':
                        'Carries the jackson-bom.version floor to consumers that do not apply the Spring Boot BOM.'
        ]
        floors.each { coordinates, rationale ->
            ['implementation', 'compileOnly'].each { conf ->
                add(conf, coordinates) { because rationale }
            }
        }
    }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-aop"

    compileOnly "org.springframework.boot:spring-boot-autoconfigure"

    // ajc wants aspectjrt on the compile classpath; spring-boot-starter-aop only brings
    // aspectjweaver at runtime. Version comes from the Spring Boot BOM.
    compileOnly 'org.aspectj:aspectjrt'
    compileOnly 'org.projectlombok:lombok'
    compileOnly "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter"
    compileOnly 'org.springframework.boot:spring-boot-starter-log4j2'
    compileOnly "ch.qos.logback:logback-classic:${logbackVersion}"
    compileOnly "ch.qos.logback:logback-core:${logbackVersion}"

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"


    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Same as main: ajc runs over every source set, so it needs aspectjrt here too.
    // testLog4j2CompileOnly and testLogbackCompileOnly extend this configuration.
    testCompileOnly 'org.aspectj:aspectjrt'
    testCompileOnly 'org.projectlombok:lombok'

    testAnnotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

}
dependencies {

    testLog4j2Implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    testLog4j2Implementation 'org.apache.logging.log4j:log4j-core'
    /* -------------------   LOG4J2 ---------------------------*/
    configurations.testLog4j2Implementation {
        exclude group: "ch.qos.logback", module: "logback-classic"
        exclude group: "ch.qos.logback", module: "logback-core"
    }

    testLogbackImplementation "ch.qos.logback:logback-classic:${logbackVersion}"
    testLogbackImplementation "ch.qos.logback:logback-core:${logbackVersion}"

    configurations.testLogbackImplementation {
        exclude group: "org.apache.logging.log4j"
    }
}

