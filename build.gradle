import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.5.4' apply false
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.darkona.logged'
version = '1.1.0'

repositories {
    mavenCentral()
    mavenLocal()
}

def filename = "${rootProject.name}-${this.version}.jar"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    compileJava {
        options.encoding = 'UTF-8'
        options.compilerArgs += [
                "-parameters"
        ]
    }
    compileTestJava{
        options.encoding = 'UTF-8'
        options.compilerArgs += [
                "-parameters"
        ]
    }
    artifacts {
        archives jar
    }

    //withJavadocJar()
    withSourcesJar()
}

jar {
    enabled = true
    archiveFileName = filename
    archiveClassifier = ''
}

publishing {
    publications {

        mavenJava(MavenPublication) {
            from components.java

            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }

        }

    }
    repositories {
        mavenLocal() // Publish to local Maven repository
    }
}

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
    }
}



dependencies {
    annotationProcessor("org.springframework.boot:spring-boot-configuration-processor")
    implementation("org.springframework.boot:spring-boot-autoconfigure")
    api ("org.springframework.boot:spring-boot-starter-aop")

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory.set(
            layout.buildDirectory.dir("generated/sources/annotationProcessor/${name}")
    )
}

test {
    useJUnitPlatform()
}

compileJava.dependsOn(processResources)