spring:
  output:
    ansi:
      enabled: always
logged:
  color: true
  otel:
    enabled: true
  mdc:
    enabled: true
  slf4j:
    color: true
    enabled: true
  logback:
    enabled: false
    appender-filters:
      - appender-name: CONSOLE
        name: NO_CONSOLE
        on-match: deny
        on-mismatch: neutral
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) %msg%n"

